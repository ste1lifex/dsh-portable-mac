<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>DSH 控制条</title>
  <style>
    /* =====================================================================
       配色与 Windows 版 DshDesktop 的 Theme.cs 一一对应：
       深色默认值写在这里，浅色由 html[data-theme="light"] 覆盖，
       主进程把内嵌 DSH 界面的真实主题与设计令牌（--dsw-alias-*）推过来。
       ===================================================================== */
    :root {
      color-scheme: dark;
      --window-bg: #151517;
      --chrome-bg: #1b1b1c;
      --card-bg: #1b1b1c;
      --border: rgba(255, 255, 255, .12);
      --text-primary: #f9fafb;
      --text-secondary: #cfd3d6;
      --text-dim: #adb2b8;
      --ghost-bg: #2c2c2e;
      --ghost-border: transparent;
      --ghost-hover: #353638;
      --ghost-active: #3e3f42;
      --accent: #4d6bfe;
      --accent-hover: #5e7bff;
      --accent-active: #3a55e0;
      --on-accent: #ffffff;
      --danger-bg: rgba(242, 90, 90, .15);
      --danger-hover: rgba(242, 90, 90, .25);
      --danger-fg: #ff8a8a;
      --green: #34d399;
      --amber: #fbbf24;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --window-bg: #ffffff;
      --chrome-bg: #f5f6f7;
      --card-bg: #f9fafb;
      --border: rgba(0, 0, 0, .10);
      --text-primary: #0f1115;
      --text-secondary: #61666b;
      --text-dim: #81858c;
      --ghost-bg: #ffffff;
      --ghost-border: rgba(0, 0, 0, .10);
      --ghost-hover: #f1f3f5;
      --ghost-active: #e9ecf2;
      --danger-bg: #fef2f2;
      --danger-hover: #fee2e2;
      --danger-fg: #ec1313;
      --green: #22c55e;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font: 12px/1.4 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--chrome-bg); color: var(--text-primary);
      display: flex; align-items: center; gap: 6px;
      padding: 0 10px;
      user-select: none;
      border-bottom: 1px solid var(--border);
    }

    /* 状态区（最左）：不再重复网页侧栏的品牌字标 */
    .status { display: inline-flex; align-items: center; gap: 7px; margin-right: 2px; min-width: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex: 0 0 auto; }
    .dot.on { background: var(--green); }
    .status-text {
      color: var(--text-secondary); font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px;
    }
    .status-text.err { color: var(--danger-fg); }

    .sep { width: 1px; height: 22px; background: var(--border); flex: 0 0 auto; margin: 0 4px; }
    .spacer { flex: 1 1 auto; }

    button {
      display: inline-flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 10px;
      font: inherit; font-weight: 600; color: var(--text-primary);
      background: var(--ghost-bg);
      border: 1px solid var(--ghost-border); border-radius: 8px;
      cursor: pointer; white-space: nowrap;
    }
    button:hover:not(:disabled) { background: var(--ghost-hover); }
    button:active:not(:disabled) { background: var(--ghost-active); }
    button:disabled { opacity: .45; cursor: default; }
    button svg { width: 12px; height: 12px; flex: 0 0 auto; display: block; }

    button.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.primary:active:not(:disabled) { background: var(--accent-active); }

    button.danger { background: var(--danger-bg); border-color: transparent; color: var(--danger-fg); }
    button.danger:hover:not(:disabled) { background: var(--danger-hover); }
    button.danger:active:not(:disabled) { background: var(--danger-bg); }

    /* 右下角余额（胶囊，悬停才显底） */
    .chip {
      height: 20px; padding: 0 8px; border-radius: 10px; gap: 5px;
      background: transparent; border: 0; color: var(--text-dim); font-weight: 500;
    }
    .chip:hover:not(:disabled) { background: var(--ghost-hover); color: var(--text-primary); }
    .chip:active:not(:disabled) { background: var(--ghost-active); }
    .chip .val { color: var(--text-secondary); }
    .chip.low .val { color: var(--amber); }

    /* 窄窗口：收起按钮文字只留图标（对应 Windows 版的紧凑模式） */
    @media (max-width: 1060px) {
      .btn-label { display: none; }
      .sep { display: none; }
    }

    /* ---- 版本信息弹窗 ---- */
    dialog {
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--card-bg); color: var(--text-primary);
      max-width: 760px; width: 80%; padding: 18px;
    }
    dialog::backdrop { background: rgba(0, 0, 0, .5); }
    dialog h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    dialog table { width: 100%; border-collapse: collapse; font-size: 12.5px; user-select: text; }
    dialog td { padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    dialog td:first-child { color: var(--text-dim); white-space: nowrap; width: 96px; }
    dialog pre {
      max-height: 260px; overflow: auto; margin: 0;
      background: var(--window-bg); padding: 10px; border-radius: 8px;
      font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: text; white-space: pre-wrap; word-break: break-all;
      border: 1px solid var(--border);
    }
    .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  </style>
</head>
<body>
  <!-- 状态放在最左：与 Windows 版一致，品牌由网页侧栏与 Dock 图标承担 -->
  <span class="status">
    <span class="dot" id="dot"></span>
    <span class="status-text" id="status">未启动</span>
  </span>
  <span class="sep"></span>

  <button id="btn-start" class="primary" title="启动服务">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2,0 L10,5 L2,10 Z" fill="currentColor"/></svg>
    <span class="btn-label">启动</span>
  </button>
  <button id="btn-stop" class="danger" title="停止服务">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="1.5" fill="currentColor"/></svg>
    <span class="btn-label">停止</span>
  </button>
  <button id="btn-restart" title="重启服务">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4C7.58,4 4,7.58 4,12C4,16.42 7.58,20 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18C8.69,18 6,15.31 6,12C6,8.69 8.69,6 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4Z" fill="currentColor"/></svg>
    <span class="btn-label">重启</span>
  </button>

  <span class="sep"></span>

  <button id="btn-reload" title="重新加载 DSH 界面">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8,1 A7,7 0 1 1 1.5,5.5 M8,1 L8,4 M8,1 L5,1" stroke="currentColor" stroke-width="1.5"/></svg>
    <span class="btn-label">刷新界面</span>
  </button>
  <button id="btn-browser" title="用系统浏览器打开 DSH">
    <svg viewBox="0 0 18 16" fill="none" aria-hidden="true"><path d="M1,5 L9,1 L17,5 L17,11 L9,15 L1,11 Z" stroke="currentColor" stroke-width="1.4"/></svg>
    <span class="btn-label">浏览器打开</span>
  </button>
  <button id="btn-logs" title="打开日志目录">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3,1.5 L13,1.5 L13,14.5 L3,14.5 Z M5.5,5 L10.5,5 M5.5,7.6 L10.5,7.6 M5.5,10.2 L8.5,10.2" stroke="currentColor" stroke-width="1.4"/></svg>
    <span class="btn-label">日志</span>
  </button>
  <button id="btn-info" title="版本信息（含错误日志，可复制）">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8,1.5 A6.5,6.5 0 1 0 8,14.5 A6.5,6.5 0 1 0 8,1.5 M8,7.2 L8,11.2 M8,4.3 L8,5.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span class="btn-label">版本信息</span>
  </button>

  <span class="spacer"></span>

  <button id="btn-balance" class="chip" title="DeepSeek 官方余额">
    <span>余额</span>
    <span class="val" id="balance">—</span>
  </button>

  <dialog id="dlg">
    <h2>版本信息</h2>
    <table>
      <tr><td>桌面外壳</td><td id="i-shell">-</td></tr>
      <tr><td>核心</td><td id="i-core">-</td></tr>
      <tr><td>端口</td><td id="i-port">-</td></tr>
      <tr><td>数据目录</td><td id="i-home">-</td></tr>
    </table>
    <h2 style="margin-top:16px">插件</h2>
    <table id="i-plugins"></table>
    <h2 style="margin-top:16px">错误日志（末尾，可选中复制）</h2>
    <pre id="i-log">-</pre>
    <div class="row">
      <button id="btn-copy">复制全部</button>
      <button id="btn-close">关闭</button>
    </div>
  </dialog>

  <script src="toolbar.js"></script>
</body>
</html>
