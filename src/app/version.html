<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>DSH 版本信息</title>
  <style>
    /* 配色与 toolbar.html / Windows 版 DshDesktop 的 Theme.cs 保持一致 */
    :root {
      color-scheme: dark;
      --window-bg: #151517;
      --chrome-bg: #1b1b1c;
      --card-bg: #1b1b1c;
      --border: rgba(255, 255, 255, .12);
      --text-primary: #f9fafb;
      --text-secondary: #cfd3d6;
      --text-dim: #adb2b8;
      --ghost-bg: #2c2c2e;
      --ghost-border: transparent;
      --ghost-hover: #353638;
      --ghost-active: #3e3f42;
      --accent: #4d6bfe;
      --accent-hover: #5e7bff;
      --on-accent: #ffffff;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --window-bg: #ffffff;
      --chrome-bg: #f5f6f7;
      --card-bg: #f9fafb;
      --border: rgba(0, 0, 0, .10);
      --text-primary: #0f1115;
      --text-secondary: #61666b;
      --text-dim: #81858c;
      --ghost-bg: #ffffff;
      --ghost-border: rgba(0, 0, 0, .10);
      --ghost-hover: #f1f3f5;
      --ghost-active: #e9ecf2;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 12.5px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--window-bg); color: var(--text-primary);
      display: flex; flex-direction: column;
      padding: 16px 18px 14px; gap: 12px;
      height: 100%; overflow: hidden;
    }

    header { display: flex; align-items: baseline; gap: 10px; flex: none; }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    header .sub { color: var(--text-dim); font-size: 12px; }

    section { flex: none; }
    section.grow { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

    h2 {
      margin: 0 0 6px; font-size: 12px; font-weight: 600;
      color: var(--text-secondary); text-transform: none;
    }
    h2 .hint { font-weight: 400; color: var(--text-dim); margin-left: 6px; }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; user-select: text; }
    td { padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    td:first-child { color: var(--text-dim); white-space: nowrap; width: 108px; }
    td.val { word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    pre {
      flex: 1 1 auto; min-height: 0; overflow: auto; margin: 0;
      background: var(--card-bg); padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border);
      font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: text; white-space: pre-wrap; word-break: break-word;
    }

    .row { display: flex; justify-content: flex-end; gap: 8px; flex: none; }

    button {
      font: inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer;
      background: var(--ghost-bg); color: var(--text-primary);
      border: 1px solid var(--ghost-border);
    }
    button:hover { background: var(--ghost-hover); }
    button:active { background: var(--ghost-active); }
    button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
    button.primary:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <header>
    <h1>DSH 版本信息</h1>
    <span class="sub" id="hdr-sub"></span>
  </header>

  <section>
    <h2>概况</h2>
    <table>
      <tr><td>桌面外壳</td><td class="val" id="i-shell">-</td></tr>
      <tr><td>核心</td><td class="val" id="i-core">-</td></tr>
      <tr><td>端口</td><td class="val" id="i-port">-</td></tr>
      <tr><td>数据目录</td><td class="val" id="i-home">-</td></tr>
      <tr><td>数据根目录</td><td class="val" id="i-support">-</td></tr>
    </table>
  </section>

  <section>
    <h2>插件</h2>
    <table id="i-plugins"></table>
  </section>

  <section class="grow">
    <h2>错误日志（末尾 40 行，可选中复制）<span class="hint" id="log-hint"></span></h2>
    <pre id="i-log">读取中…</pre>
  </section>

  <div class="row">
    <button id="btn-logs">打开日志目录</button>
    <button id="btn-copy" class="primary">复制全部</button>
    <button id="btn-close">关闭</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // 主题令牌映射：与 toolbar.js 保持一致
    const TOKEN_VARS = {
      border2: '--border',
      label1: '--text-primary',
      label2: '--text-secondary',
      label3: '--text-dim',
      bgBase: '--window-bg',
    };

    function applyTheme(t) {
      if (!t) return;
      document.documentElement.dataset.theme = t.dark ? 'dark' : 'light';
      const root = document.documentElement.style;
      for (const v of Object.values(TOKEN_VARS)) root.removeProperty(v);
      for (const [token, cssVar] of Object.entries(TOKEN_VARS)) {
        if (t.tokens && t.tokens[token]) root.setProperty(cssVar, t.tokens[token]);
      }
    }

    let dialogText = '';

    function fill(status, logs) {
      const s = status || {};
      $('i-shell').textContent = s.shellVersion ? 'v' + s.shellVersion : '(未知)';
      $('i-core').textContent = s.coreVersion ? '@deepseek-ai/dsh ' + s.coreVersion : '(未知)';
      $('i-port').textContent = String(s.port || '');
      $('i-home').textContent = s.home || '(未知)';
      $('i-support').textContent = s.support || '(未知)';
      $('hdr-sub').textContent = s.coreVersion ? '核心 ' + s.coreVersion : '';

      const plugins = s.plugins || [];
      $('i-plugins').innerHTML = plugins.length
        ? plugins.map((p) => `<tr><td>${escapeHtml(p.label)}</td><td class="val">${escapeHtml(p.name)} @ ${escapeHtml(p.version)}</td></tr>`).join('')
        : '<tr><td>(无)</td><td class="val"></td></tr>';

      const errLog = (logs && String(logs.err || '').trim()) || '(空)';
      $('i-log').textContent = errLog;
      $('log-hint').textContent = logs && logs.logsDir ? '' : '';

      dialogText = [
        'DSH 版本信息',
        `桌面外壳：${$('i-shell').textContent}`,
        `核心：${$('i-core').textContent}`,
        `端口：${$('i-port').textContent}`,
        `数据目录：${$('i-home').textContent}`,
        `数据根目录：${$('i-support').textContent}`,
        '',
        '插件：',
        ...plugins.map((p) => `  ${p.label}  ${p.name} @ ${p.version}`),
        '',
        '错误日志（末尾）：',
        errLog,
      ].join('\n');
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    $('btn-copy').addEventListener('click', async () => {
      const sel = window.getSelection && String(window.getSelection()).trim();
      const r = await window.dsh.copyText(sel || dialogText);
      const btn = $('btn-copy');
      btn.textContent = r && r.ok ? '已复制' : '复制失败';
      setTimeout(() => { btn.textContent = '复制全部'; }, 1200);
    });

    $('btn-logs').addEventListener('click', () => window.dsh.openLogs());
    $('btn-close').addEventListener('click', () => window.close());

    window.dsh.onTheme(applyTheme);

    (async () => {
      try { applyTheme(await window.dsh.getTheme()); } catch { /* 忽略 */ }
      try {
        const [status, logs] = await Promise.all([
          window.dsh.getStatus(),
          window.dsh.readLogTail(),
        ]);
        fill(status, logs);
      } catch (e) {
        $('i-log').textContent = '读取失败：' + (e && e.message ? e.message : e);
      }
    })();
  </script>
</body>
</html>
