<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>正在准备 DSH…</title>
  <style>
    /* 启动页在网页端界面出现之前显示：直接跟随 macOS 外观（prefers-color-scheme），
       配色与 DshDesktop / macOS 控制条保持一致。 */
    :root {
      color-scheme: light dark;
      --bg: #151517;
      --fg: #f9fafb;
      --sub: #cfd3d6;
      --dim: #adb2b8;
      --track: #2c2c2e;
      --accent: #4d6bfe;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ffffff; --fg: #0f1115; --sub: #61666b; --dim: #81858c; --track: #e9ecf2; }
    }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--sub);
      font: 14px/1.7 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
    }
    .logo { font-size: 28px; font-weight: 700; letter-spacing: 1px; color: var(--fg); }
    .sub { color: var(--sub); font-size: 13px; }
    .spin {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid var(--track); border-top-color: var(--accent);
      animation: r 900ms linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
    .hint { color: var(--dim); font-size: 12px; max-width: 460px; text-align: center; }
  </style>
</head>
<body>
  <div class="logo">DeepSeek Harness</div>
  <div class="spin"></div>
  <div class="sub">正在准备运行环境，请稍候…</div>
  <div class="hint">首次启动需要展开离线依赖缓存并安装依赖，约 1-2 分钟；
    进度显示在顶部控制条。完成后界面会自动出现。</div>
</body>
</html>
